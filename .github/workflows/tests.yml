name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"

      # The tree is flat: one ruff config at the repo root governs both packages.
      - name: Lint
        run: ruff check src tests examples

      - name: Format check
        run: ruff format --check src tests examples

      # --cov without a target uses [tool.coverage.run] source from pyproject.toml.
      - name: Engine tests
        run: pytest tests --ignore=tests/gui --cov --cov-report=term-missing

      - name: GUI tests
        # The GUI is not held to the engine's 90% floor.
        run: pytest tests/gui --cov=seq_ext_gui --cov-report=term-missing --cov-fail-under=0

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Tests leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
