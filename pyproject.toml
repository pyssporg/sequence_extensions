[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-extensions-flow"
dynamic = ["version"]
authors = [
  { name = "pyssporg contributors" },
]
description = "Higher-order function extensions for Python lists, dicts, and generators, plus a mini flow engine on dependency-graph futures: deterministic parallel campaigns, local or at HPC (retry, timeout, JSON-lines run log). The optional `gui` extra adds a local offline web GUI for previewing and running flow plans."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["list", "dict", "functional", "extensions", "generator", "graph", "flow", "parallel", "retry", "audit", "gui"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
flow-runner = "sequence_extensions.flow_runner:main"
seq-ext-gui = "seq_ext_gui.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.16.10,<0.17",
  "jsonschema>=4.21,<5",
  "httpx>=0.27,<1",
]
gui = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.21,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/pyssporg/sequence_extensions"
Issues = "https://github.com/pyssporg/sequence_extensions/issues"
Documentation = "https://github.com/pyssporg/sequence_extensions#readme"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
xfail_strict = true
addopts = "-ra"
markers = [
  "level_static",
  "level_unit",
  "level_component",
  "level_contract",
  "level_integration",
  "level_system",
  "level_acceptance",
  "slow",
  "flaky_timing: asserts a wall-clock bound or uses sleeps for synchronisation",
  "integration: end-to-end tests that spawn the real worker subprocess",
]

[tool.coverage.run]
source = ["sequence_extensions"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["e2e", "markers", "sequence_extensions", "seq_ext_gui"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sequence_extensions = ["schemas/*.json"]
seq_ext_gui = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "sequence_extensions.__version__"}